<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXL QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #173444; background: #edf4f5; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 20px; }
    main { width: min(100%, 560px); overflow: hidden; border-radius: 20px; background: #fff; box-shadow: 0 16px 48px #15354329; }
    header { padding: 24px 28px; color: #fff; background: linear-gradient(135deg, #113b52, #18717a); }
    header p { margin: 0 0 5px; font-size: .82rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; opacity: .85; }
    h1 { margin: 0; font-size: clamp(1.45rem, 5vw, 2rem); }
    section { padding: 26px 28px 30px; }
    p { line-height: 1.45; }
    .instructions { margin-top: 0; color: #4a626d; }
    button { width: 100%; min-height: 52px; border: 0; border-radius: 12px; padding: 12px 18px; color: #fff; background: #e66a2d; cursor: pointer; font: inherit; font-size: 1rem; font-weight: 700; }
    button:hover { background: #cc5821; }
    button:focus-visible { outline: 3px solid #1a8190; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .65; }
    #reader { display: none; overflow: hidden; border-radius: 14px; background: #102632; }
    #reader video { width: 100% !important; border-radius: 14px; }
    #status { min-height: 26px; margin-top: 18px; padding: 14px 16px; border-radius: 12px; color: #38515d; background: #edf3f4; }
    #status.success { color: #0b593b; background: #dff4e8; }
    #status.error { color: #8b2520; background: #fde7e5; }
    .fallback { margin-top: 18px; font-size: .92rem; color: #5d6d73; }
    label { display: block; margin-bottom: 7px; font-weight: 700; }
    input { width: 100%; font: inherit; }
  </style>
</head>
<body>
  <main>
    <header><p>Expanded Learning</p><h1>Student QR Scanner</h1></header>
    <section>
      <p class="instructions">Choose <strong>Open Camera</strong>, allow camera access, then hold the student QR code inside the camera view.</p>
      <button id="open-camera" type="button">Open Camera</button>
      <div id="reader" aria-label="QR code camera view"></div>
      <div id="status" role="status" aria-live="polite">Camera is ready when you are.</div>
      <div class="fallback"><label for="image-file">Or scan a saved QR image</label><input id="image-file" type="file" accept="image/*"></div>
    </section>
  </main>
  <script>
    const button = document.querySelector('#open-camera');
    const reader = document.querySelector('#reader');
    const status = document.querySelector('#status');
    const imageFile = document.querySelector('#image-file');
    let scanner;
    let scanned = false;

    function setStatus(message, type) {
      status.textContent = message;
      status.className = type || '';
    }
    function sendScan(text) {
      if (scanned) return;
      scanned = true;
      setStatus('Scan complete. Returning to the sign-in page…', 'success');
      if (window.opener) {
        window.opener.postMessage({ type: 'EXL_QR_SCAN', text }, '*');
        window.setTimeout(() => window.close(), 700);
      } else {
        setStatus('Scan complete. This window was opened without its sign-in page.', 'error');
      }
    }
    async function openCamera() {
      try {
        button.disabled = true;
        setStatus('Requesting camera access…');
        scanner = scanner || new Html5Qrcode('reader');
        reader.style.display = 'block';
        await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 250, height: 250 } }, sendScan, () => {});
        setStatus('Camera is open. Hold the QR code inside the square.');
      } catch (error) {
        reader.style.display = 'none';
        setStatus('Camera could not open. Allow camera access and try again.', 'error');
      } finally {
        button.disabled = false;
      }
    }
    button.addEventListener('click', openCamera);
    imageFile.addEventListener('change', async event => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        scanner = scanner || new Html5Qrcode('reader');
        sendScan(await scanner.scanFile(file, true));
      } catch {
        setStatus('That image could not be read as a QR code.', 'error');
      } finally {
        imageFile.value = '';
      }
    });
  </script>
</body>
</html>
